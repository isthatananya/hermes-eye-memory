[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-eye-memory"
version = "0.1.0"
description = "Local visual memory for Hermes: photo library indexing, semantic search, albums, receipts, and camera recall."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ananya" }]
dependencies = [
  "pillow>=10.0,<14",
  "numpy>=1.26,<3",
  "reportlab>=4.0,<5",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4,<1"]
ocr = ["rapidocr-onnxruntime>=1.3,<2"]
camera = ["opencv-python>=4.9,<5"]
heic = ["pillow-heif>=0.16,<1"]
all = [
  "fastembed>=0.4,<1",
  "rapidocr-onnxruntime>=1.3,<2",
  "opencv-python>=4.9,<5",
  "pillow-heif>=0.16,<1",
]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["hermes_eye_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib --basetemp=.pytest-tmp"
